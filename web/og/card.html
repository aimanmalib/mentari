<!doctype html>
<!-- The link preview card. web/og/render.ts fills the {{...}} slots from config/app.json, the default locale
     and web/src/styles/tokens.css, then captures it at web.share imageWidth x imageHeight. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
{{tokens}}
html, body { margin: 0; }
body {
  width: {{width}}px; height: {{height}}px; overflow: hidden; box-sizing: border-box;
  display: flex; flex-direction: column; padding: 56px 72px 0;
  background: var(--silicon); color: var(--silicon-text); font-family: var(--font-body);
}
.chrome {
  display: flex; justify-content: space-between; align-items: center; gap: 32px;
  padding-bottom: 18px; border-bottom: 2px solid var(--busbar-on-silicon);
  font: 500 22px/1.3 var(--font-mono); letter-spacing: 0.02em;
}
.who { display: flex; align-items: center; gap: 14px; color: var(--silicon-text); }
.who svg { width: 36px; height: 36px; display: block; }
.host { color: var(--silicon-text); opacity: 0.8; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 880px; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-stretch: 80%;
  font-size: 84px; line-height: 0.95; letter-spacing: -0.01em; text-wrap: balance;
}
p { margin: 28px 0 0; font-size: 30px; line-height: 1.35; font-weight: 500; text-wrap: pretty; }
.horizon { position: relative; height: 128px; margin: 0 -72px; flex: none; }
.horizon::before {
  content: ""; position: absolute; right: 120px; bottom: 34px;
  width: 200px; height: 100px; border-radius: 100px 100px 0 0; background: var(--noon);
}
.horizon::after { content: ""; position: absolute; left: 0; right: 0; bottom: 28px; height: 8px; background: var(--daylight); }
</style>
</head>
<body>
  <div class="chrome"><span class="who">{{logo}}{{siteName}}</span><span class="host">{{host}}</span></div>
  <main>
    <h1>{{title}}</h1>
    <p>{{description}}</p>
  </main>
  <div class="horizon" aria-hidden="true"></div>
</body>
</html>
