name: Bug report
description: Something in the contracts, the server or the site doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Contracts, Server, Site, Tests or CI, Documentation]
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or page URL
  - type: textarea
    id: logs
    attributes:
      label: Output or transaction hash (never paste a private key or seed phrase)
      render: text
